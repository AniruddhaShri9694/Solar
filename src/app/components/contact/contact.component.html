<section id="contact" class="contact">
  <div class="container">
    <div class="section-header fade-in">
      <h2>Get In Touch</h2>
      <p>Let's start a conversation about your solar energy needs</p>
    </div>

    <div class="contact-wrapper">

      <form class="contact-form fade-in-down" (ngSubmit)="handleSubmit()">
        <div class="form-grid">

          <!-- Full Name -->
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              [(ngModel)]="fullName"
              name="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>

          <!-- Housing Society Name -->
          <div class="form-group">
            <label for="societyName">Name of the Housing Society</label>
            <input
              type="text"
              id="societyName"
              [(ngModel)]="societyName"
              name="societyName"
              placeholder="Enter society name"
              required
            />
          </div>

          <!-- PIN Code -->
          <div class="form-group">
            <label for="pinCode">PIN Code</label>
            <input
              type="text"
              id="pinCode"
              [(ngModel)]="pinCode"
              name="pinCode"
              placeholder="Enter PIN code"
              maxlength="6"
              pattern="[0-9]{6}"
              inputmode="numeric"
              required
            />
          </div>

          <!-- WhatsApp Number -->
          <div class="form-group">
            <label for="whatsapp">WhatsApp Number</label>
            <input
              type="tel"
              id="whatsapp"
              [(ngModel)]="whatsappNumber"
              name="whatsappNumber"
              placeholder="Enter WhatsApp number"
              required
              maxlength="15"
            />
          </div>

          <!-- AGM Approval Status -->
          <div class="form-group">
            <label for="agmStatus">AGM Approval Status</label>
            <select
              id="agmStatus"
              [(ngModel)]="agmApprovalStatus"
              name="agmApprovalStatus"
              required
            >
              <option value="" selected>Select AGM Status</option>
              <option value="Approved">Approved</option>
              <option value="Pending">Pending</option>
              <option value="Not Discussed">Not Discussed</option>
            </select>
          </div>

          <!-- Designation -->
          <div class="form-group">
            <label for="designation">What is your Designation in the Society?</label>

            <select
              id="designation"
              [(ngModel)]="designation"
              name="designation"
              required
            >
              <option value="" selected>Select Designation</option>
              <option value="Management Committee Member">
                Management Committee Member
              </option>
              <option value="Resident">Resident</option>
              <option value="Builder">Builder</option>
              <option value="Facility Manager">Facility Manager</option>
            </select>
          </div>

           <!-- Monthly Electricity Bill -->
          <div class="form-group full-width">
            <label for="agmStatus">Monthly Electricity Bill</label>

            <div class="radio-group">
              <label>
                <input
                  type="radio"
                  name="electricityBill"
                  [(ngModel)]="electricityBill"
                  value="0 - ₹50,000"
                />
                0 - ₹50,000
              </label>

              <label>
                <input
                  type="radio"
                  name="electricityBill"
                  [(ngModel)]="electricityBill"
                  value="₹50,000 - ₹2 Lacs"
                />
                ₹50,000 - ₹2 Lacs
              </label>

              <label>
                <input
                  type="radio"
                  name="electricityBill"
                  [(ngModel)]="electricityBill"
                  value="Above ₹2 Lacs"
                />
                Above ₹2 Lacs
              </label>
            </div>
          </div>
        </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn submit-btn"
            [disabled]="
              !fullName ||
              !societyName ||
              !pinCode ||
              !whatsappNumber
              || whatsappNumber.length < 10 || electricityBill == ''
            "
          >
            Get Free Quote
          </button>

        </form>
    </div>
  </div>
</section>
