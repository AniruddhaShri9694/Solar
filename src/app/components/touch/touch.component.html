<section id="touch" class="contact">
  <div class="container">
    <div class="section-header fade-in">
        <h2>Let's Build a Greener Tomorrow</h2>
        <p>Reach out to our solar specialists and take the first step toward energy independence.</p>
    </div>

    <div class="contact-wrapper">
      <div class="contact-info fade-in">
        <div class="info-card">
          <div class="info-icon">📧</div>
          <h3>Email</h3>
          <p>{{ email }}</p>
          <button class="contact-btn" (click)="openEmail()">Send Email</button>
        </div>

        <div class="info-card">
          <div class="info-icon">📱</div>
          <h3>Phone</h3>
          <p>{{ phone }}</p>

          <div class="section-wrapper">
              <button class="contact-btn" (click)="makeCall()">
                <i class="fas fa-phone-alt"></i>
                </button>
    
                <button class="contact-btn whatsapp-btn" (click)="openWhatsApp()">
                <i class="fab fa-whatsapp"></i>
                </button>
          </div>
            
        </div>

        <div class="info-card">
          <div class="info-icon">🌐</div>
          <h3>Follow Us</h3>
          <div class="social-links">
            <!-- <a href="#" class="social-link">Facebook</a> -->
            <!-- <button type="button" class="social-link" (click)="openInstagram()" title="Visit our Instagram">Instagram</button> -->
            <!-- <a href="#" class="social-link">LinkedIn</a> -->

            <a href="https://www.instagram.com/sion_energy_solar/" class="social-icon" target="_blank">
            <img src="/assets/images/instagram.png" alt="Instagram" class="social-icon-image" style="width: 40px" />
          </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
