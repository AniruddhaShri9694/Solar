<section id="touch" class="contact">
  <div class="container">
    <div class="section-header fade-in">
      <h2>Let's Build a Greener Tomorrow</h2>
      <p>Reach out to our solar specialists and take the first step toward energy independence.</p>
    </div>

    <div class="contact-wrapper">
      <div class="contact-info fade-in">
        <div class="info-card">
          <div class="info-icon">
            <img src="/assets/images/email.png" alt="Email" />
          </div>
          <h3>Email</h3>
          <p>{{ email }}</p>
          <button class="contact-btn send-email" (click)="openEmail()">Send Email</button>
        </div>

        <div class="info-card">
          <div class="info-icon phone-icon">📱</div>
          <h3>Phone</h3>
          <p>{{ phone }}</p>

          <div class="section-wrapper">
            <button class="contact-btn call-btn" (click)="makeCall()" aria-label="Call us">
              <i class="fas fa-phone-alt"></i>
            </button>

            <button class="contact-btn whatsapp-btn" (click)="openWhatsApp()" aria-label="Chat on WhatsApp">
              <i class="fab fa-whatsapp"></i>
            </button>
          </div>
        </div>

        <div class="info-card follow-card">
          <div class="info-icon globe-icon">🌐</div>
          <h3>Follow Us</h3>
          <div class="social-links">
            <a href="https://www.instagram.com/sion_energy_solar/" class="social-icon" target="_blank" aria-label="Instagram">
              <img src="/assets/images/instagram.png" alt="Instagram" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
