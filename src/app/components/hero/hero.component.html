<section id="home" class="hero">
  <div class="container hero-content">
    <div class="hero-text fade-in">
      <h1>Welcome to Sion Energy</h1>
      <p class="subtitle">The Future is Solar</p>
      <p class="description">
        Harness the power of the sun with our cutting-edge solar solutions. Save up to 90% on electricity bills while supporting a sustainable future.
      </p>
      <div class="hero-buttons">
        <button class="btn" (click)="scrollToContact()">Get In Touch</button>
        <button class="btn btn-outline">Learn More</button>
      </div>
    </div>
    <div class="hero-image float">
      <div class="hero-shape">
        <span class="emoji">⚡</span>
      </div>
    </div>
  </div>
  
  <div class="scroll-indicator">
    <div class="mouse"></div>
    <div class="scroll-animation"></div>
  </div>
</section>
